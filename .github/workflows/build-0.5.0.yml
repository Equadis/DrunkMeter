name: Build DrunkMeter 0.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-0.5.0.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish 0.5.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build DrunkMeter
          mkdir -p build
          unzip -q DrunkMeter-0.4.0.zip -d build
          cd build/DrunkMeter
          patch -p1 < ../../drunkmeter-0.5.0.patch
          cd ../..
          cp -a build/DrunkMeter DrunkMeter
          rm -f DrunkMeter-0.5.0.zip
          (cd build && zip -qr ../DrunkMeter-0.5.0.zip DrunkMeter)
          rm -rf build
          rm -f DrunkMeter-0.4.0.zip drunkmeter-0.5.0.patch README.tmp .github/workflows/build-0.5.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add offline decay and freeze fix in DrunkMeter 0.5.0'
          git push
