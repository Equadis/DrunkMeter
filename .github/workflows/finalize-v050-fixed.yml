name: Finalize DrunkMeter 0.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v050-fixed.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patched addon
        shell: python
        run: |
          import pathlib, zipfile, shutil, textwrap, re

          root = pathlib.Path.cwd()
          old_zip = root / "DrunkMeter-0.4.0.zip"
          build = root / ".build-v050"
          if build.exists():
              shutil.rmtree(build)
          build.mkdir()

          with zipfile.ZipFile(old_zip, "r") as z:
              z.extractall(build)

          addon = build / "DrunkMeter"
          lua_path = addon / "DrunkMeter.lua"
          toc_path = addon / "DrunkMeter.toc"
          lua = lua_path.read_text(encoding="utf-8")

          lua = lua.replace("-- DrunkMeter 0.4.0", "-- DrunkMeter 0.5.0", 1)
          lua = lua.replace('DM.VERSION = "0.4.0"', 'DM.VERSION = "0.5.0"', 1)

          extension = textwrap.dedent(r'''

          -- DrunkMeter 0.5.0: offline persistence and stable chat-state synchronisation.
          -- SavedVariables are the persistent store; WoW 1.12 addons cannot safely write
          -- arbitrary text files. The rolling history is deliberately bounded.
          DM.OFFLINE_HISTORY_MAX = 20
          DM.MAX_LOG_ENTRIES = 200
          DM.OFFLINE_SNAPSHOT_INTERVAL = 1.0

          local function DM050Clamp(v, lo, hi)
              v = tonumber(v) or 0
              if v < lo then return lo end
              if v > hi then return hi end
              return v
          end

          local function DM050Trim(list, maxEntries)
              if type(list) ~= "table" then return end
              maxEntries = tonumber(maxEntries) or 0
              if maxEntries < 1 then return end
              while table.getn(list) > maxEntries do
                  table.remove(list, 1)
              end
          end

          -- Keep the existing debug log useful without allowing SavedVariables to grow forever.
          local DM050OriginalLog = DM.Log
          function DM:Log(text)
              DM050OriginalLog(self, text)
              if type(DrunkMeterLog) == "table" then
                  DM050Trim(DrunkMeterLog, self.MAX_LOG_ENTRIES)
              end
          end

          function DM:GetEpochTime050()
              if type(time) ~= "function" then return nil end
              local ok, value = pcall(time)
              if ok and tonumber(value) then return tonumber(value) end
              return nil
          end

          function DM:GetServerClock050()
              if type(GetGameTime) ~= "function" then return nil, nil end
              local ok, hour, minute = pcall(GetGameTime)
              if not ok then return nil, nil end
              return tonumber(hour), tonumber(minute)
          end

          function DM:EnsureOfflineDB050()
              self:EnsureDB()
              if type(DrunkMeterDB.offlineHistory) ~= "table" then
                  DrunkMeterDB.offlineHistory = {}
              end
              DM050Trim(DrunkMeterDB.offlineHistory, self.OFFLINE_HISTORY_MAX)
              if type(DrunkMeterLog) == "table" then
                  DM050Trim(DrunkMeterLog, self.MAX_LOG_ENTRIES)
              end
          end

          function DM:SaveOfflineSnapshot050(reason, addHistory)
              self:EnsureOfflineDB050()
              local epoch = self:GetEpochTime050()
              if not epoch then return false end

              local tickSeconds = tonumber(self.DECAY_SECONDS) or 10
              if tickSeconds <= 0 then tickSeconds = 10 end

              local phase = tonumber(self.decayElapsed) or 0
              if phase < 0 then phase = 0 end
              if phase >= tickSeconds then
                  phase = phase - math.floor(phase / tickSeconds) * tickSeconds
              end

              local serverHour, serverMinute = self:GetServerClock050()
              local entry = {
                  epoch = epoch,
                  value = DM050Clamp(DrunkMeterDB.value, 0, self.MAX_VALUE),
                  decayElapsed = phase,
                  reason = tostring(reason or "snapshot"),
                  serverHour = serverHour,
                  serverMinute = serverMinute
              }
              DrunkMeterDB.offlineSnapshot = entry

              if addHistory then
                  table.insert(DrunkMeterDB.offlineHistory, {
                      epoch = entry.epoch,
                      value = entry.value,
                      decayElapsed = entry.decayElapsed,
                      reason = entry.reason,
                      serverHour = entry.serverHour,
                      serverMinute = entry.serverMinute
                  })
                  DM050Trim(DrunkMeterDB.offlineHistory, self.OFFLINE_HISTORY_MAX)
              end
              return true
          end

          function DM:FormatOfflineDuration050(seconds)
              seconds = math.floor(tonumber(seconds) or 0)
              if seconds < 0 then seconds = 0 end
              local minutes = math.floor(seconds / 60)
              local secs = seconds - minutes * 60
              local hours = math.floor(minutes / 60)
              minutes = minutes - hours * 60
              if hours > 0 then
                  return hours .. "h " .. minutes .. "m " .. secs .. "s"
              elseif minutes > 0 then
                  return minutes .. "m " .. secs .. "s"
              end
              return secs .. "s"
          end

          function DM:CalculateOfflineRecovery050()
              self:EnsureOfflineDB050()
              local snap = DrunkMeterDB.offlineSnapshot
              if type(snap) ~= "table" then return nil end

              local savedEpoch = tonumber(snap.epoch)
              local savedValue = tonumber(snap.value)
              local now = self:GetEpochTime050()
              if not savedEpoch or not savedValue or not now then return nil end

              savedValue = DM050Clamp(savedValue, 0, self.MAX_VALUE)
              local tickSeconds = tonumber(self.DECAY_SECONDS) or 10
              if tickSeconds <= 0 then tickSeconds = 10 end
              local savedPhase = tonumber(snap.decayElapsed) or 0
              if savedPhase < 0 then savedPhase = 0 end
              if savedPhase >= tickSeconds then
                  savedPhase = savedPhase - math.floor(savedPhase / tickSeconds) * tickSeconds
              end

              local offlineSeconds = math.floor(now - savedEpoch)
              if offlineSeconds < 0 then
                  return {
                      skippedClock = true,
                      offlineSeconds = offlineSeconds,
                      before = savedValue,
                      after = savedValue,
                      phase = savedPhase,
                      ticks = 0
                  }
              end

              local totalElapsed = savedPhase + offlineSeconds
              local ticks = math.floor(totalElapsed / tickSeconds)
              local after = savedValue - ticks
              if after < 0 then after = 0 end
              local phase = totalElapsed - ticks * tickSeconds
              if after <= 0 then phase = 0 end

              return {
                  offlineSeconds = offlineSeconds,
                  before = savedValue,
                  after = after,
                  phase = phase,
                  ticks = ticks,
                  now = now
              }
          end

          function DM:ApplyOfflineRecovery050(recovery)
              if type(recovery) ~= "table" then return end
              if recovery.skippedClock then
                  DrunkMeterDB.value = recovery.before
                  self.decayElapsed = recovery.phase or 0
                  self:Log("offline recovery skipped | system clock moved backwards by "
                      .. math.abs(recovery.offlineSeconds or 0) .. "s")
                  return
              end

              DrunkMeterDB.value = DM050Clamp(recovery.after, 0, self.MAX_VALUE)
              self.decayElapsed = tonumber(recovery.phase) or 0
              self.warningState = nil
              DrunkMeterDB.lastOfflineSeconds = recovery.offlineSeconds
              DrunkMeterDB.lastOfflineBefore = recovery.before
              DrunkMeterDB.lastOfflineAfter = recovery.after
              DrunkMeterDB.lastOfflineTicks = recovery.ticks

              if recovery.offlineSeconds and recovery.offlineSeconds > 0 then
                  table.insert(DrunkMeterDB.offlineHistory, {
                      epoch = recovery.now,
                      value = recovery.after,
                      decayElapsed = recovery.phase,
                      reason = "login-recovery",
                      offlineSeconds = recovery.offlineSeconds,
                      before = recovery.before,
                      ticks = recovery.ticks
                  })
                  DM050Trim(DrunkMeterDB.offlineHistory, self.OFFLINE_HISTORY_MAX)
              end

              if self.UpdateBar then self:UpdateBar() end
              if self.initialized and self.RefreshLevelDisplays then self:RefreshLevelDisplays() end

              if recovery.ticks and recovery.ticks > 0 and recovery.before > recovery.after then
                  local msg = "offline " .. self:FormatOfflineDuration050(recovery.offlineSeconds)
                      .. " | estimated " .. math.floor(recovery.before + 0.5)
                      .. " -> " .. math.floor(recovery.after + 0.5)
                  if DEFAULT_CHAT_FRAME then
                      DEFAULT_CHAT_FRAME:AddMessage("|cff33ff99DrunkMeter:|r " .. msg)
                  end
                  self:Log("offline recovery | " .. recovery.offlineSeconds .. "s | ticks="
                      .. recovery.ticks .. " | " .. math.floor(recovery.before + 0.5)
                      .. " -> " .. math.floor(recovery.after + 0.5))
              end
          end

          -- Recover before the first live decay tick, then re-apply the recovered value after
          -- the existing initializer has created the UI and reset its live decay accumulator.
          local DM050OriginalInitialize = DM.Initialize
          function DM:Initialize()
              if self.initialized then return end
              self:EnsureOfflineDB050()
              local recovery = self:CalculateOfflineRecovery050()
              DM050OriginalInitialize(self)
              if recovery then
                  self:ApplyOfflineRecovery050(recovery)
              end
              self:SaveOfflineSnapshot050("session-start", false)
          end

          local function DM050Lower(text)
              return string.lower(tostring(text or ""))
          end

          local function DM050MessageEqualsGlobal(message, globalName)
              local value = getglobal and getglobal(globalName) or nil
              if type(value) ~= "string" then return false end
              return DM050Lower(message) == DM050Lower(value)
          end

          local function DM050StateFromMessage(message)
              local m = DM050Lower(message)
              if m == "" then return nil end

              if DM050MessageEqualsGlobal(message, "DRUNK_MESSAGE_SELF1") then return "SOBER" end
              if DM050MessageEqualsGlobal(message, "DRUNK_MESSAGE_SELF2") then return "TIPSY" end
              if DM050MessageEqualsGlobal(message, "DRUNK_MESSAGE_SELF3") then return "DRUNK" end
              if DM050MessageEqualsGlobal(message, "DRUNK_MESSAGE_SELF4") then return "SMASHED" end

              -- OctoWoW/custom-client wording and drink-specific variants.
              if string.find(m, "you feel completely smashed", 1, true) then return "SMASHED" end
              if string.find(m, "you feel drunk", 1, true) then return "DRUNK" end
              if string.find(m, "you feel tipsy", 1, true) then return "TIPSY" end
              if string.find(m, "you feel sober", 1, true) then return "SOBER" end
              return nil
          end

          local function DM050BandValue(self, state, before)
              before = DM050Clamp(before, 0, self.MAX_VALUE)
              local drunkAt = tonumber(self.DRUNK_AT) or 50
              local smashedAt = tonumber(self.SMASHED_AT) or 90
              if state == "SOBER" then
                  return 0
              elseif state == "TIPSY" then
                  if before >= 1 and before < drunkAt then return before end
                  return 1
              elseif state == "DRUNK" then
                  if before >= drunkAt and before < smashedAt then return before end
                  return drunkAt
              elseif state == "SMASHED" then
                  -- Crucial: values already in the smashed band are preserved. The older
                  -- chat synchroniser could choose a representative value (98), which meant
                  -- another smashed message after drinking could pin the meter at 98.
                  if before >= smashedAt then return before end
                  return smashedAt
              end
              return before
          end

          -- Keep all existing chat-state side effects (including warning/audio behaviour),
          -- then enforce a band-safe value based on the value from BEFORE the message.
          local DM050OriginalOnEvent = DM.OnEvent
          function DM:OnEvent(ev)
              if ev == "CHAT_MSG_SYSTEM" then
                  local before = DrunkMeterDB and tonumber(DrunkMeterDB.value) or 0
                  local state = DM050StateFromMessage(arg1)
                  DM050OriginalOnEvent(self, ev)
                  if state then
                      local wanted = DM050BandValue(self, state, before)
                      local current = DrunkMeterDB and tonumber(DrunkMeterDB.value) or 0
                      if current ~= wanted then
                          DrunkMeterDB.value = wanted
                          self.warningState = nil
                          if self.UpdateBar then self:UpdateBar() end
                          if self.initialized and self.RefreshLevelDisplays then
                              self:RefreshLevelDisplays()
                          end
                          self:Log("chat band safeguard | " .. state .. " | "
                              .. math.floor(current + 0.5) .. " -> " .. math.floor(wanted + 0.5))
                      end
                      if self.initialized then
                          self:SaveOfflineSnapshot050("chat-" .. DM050Lower(state), true)
                      end
                  end
                  return
              end
              return DM050OriginalOnEvent(self, ev)
          end

          -- Maintain the latest exact-ish in-memory checkpoint and only append to the rolling
          -- history when the tracked value changes. WoW writes SavedVariables to disk on logout/reload.
          local DM050OfflineDriver = CreateFrame("Frame", "DrunkMeterOfflineDriver", UIParent)
          DM050OfflineDriver:RegisterEvent("PLAYER_LOGOUT")
          DM050OfflineDriver.elapsed = 0
          DM050OfflineDriver.lastValue = nil
          DM050OfflineDriver:SetScript("OnUpdate", function()
              if not DM.initialized then return end
              this.elapsed = (this.elapsed or 0) + (arg1 or 0)
              if this.elapsed < (DM.OFFLINE_SNAPSHOT_INTERVAL or 1) then return end
              this.elapsed = 0
              local value = DrunkMeterDB and tonumber(DrunkMeterDB.value) or 0
              local changed = this.lastValue ~= nil and value ~= this.lastValue
              DM:SaveOfflineSnapshot050(changed and "value-change" or "heartbeat", changed)
              this.lastValue = value
          end)
          DM050OfflineDriver:SetScript("OnEvent", function()
              if event == "PLAYER_LOGOUT" and DM.initialized then
                  DM:SaveOfflineSnapshot050("logout", true)
                  DM:Log("session end | value=" .. math.floor((DrunkMeterDB.value or 0) + 0.5)
                      .. " | phase=" .. string.format("%.2f", tonumber(DM.decayElapsed) or 0))
              end
          end)
          ''')

          lua += extension
          lua_path.write_text(lua, encoding="utf-8")

          toc = toc_path.read_text(encoding="utf-8")
          toc = toc.replace("## Version: 0.4.0", "## Version: 0.5.0")
          toc_path.write_text(toc, encoding="utf-8")

          addon_readme = """DrunkMeter 0.5.0
          =================

          Vanilla WoW / OctoWoW addon for tracking estimated drunkenness.

          Features
          --------
          - Tracks confirmed alcohol consumption and potency.
          - Syncs from Blizzard sober/tipsy/drunk/smashed system messages without pinning smashed values to 98.
          - Corrects drunk-distorted hostile enemy levels on the target frame and visible nameplates.
          - Uses a compact textured vertical meter with threshold warnings.
          - Automatically estimates normal decay while you are offline.

          Offline decay
          -------------
          The addon stores its current value, partial decay-tick progress, wall-clock timestamp, and
          server hour/minute in SavedVariables. On the next login it applies the same live decay rate
          to elapsed offline time and resumes the partial tick instead of starting it over.

          The latest 20 offline/state snapshots and 200 debug-log entries are retained. Older entries
          are removed automatically so the SavedVariables file remains small.

          Install
          -------
          Copy the DrunkMeter folder to Interface\\AddOns\\DrunkMeter and enable it from the AddOns menu.
          """
          (addon / "README.txt").write_text(textwrap.dedent(addon_readme), encoding="utf-8")

          src = root / "src"
          if src.exists():
              shutil.rmtree(src)
          (src / "DrunkMeter").parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(addon, src / "DrunkMeter")

          new_zip = root / "DrunkMeter-0.5.0.zip"
          if new_zip.exists():
              new_zip.unlink()
          with zipfile.ZipFile(new_zip, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for path in sorted(addon.rglob("*")):
                  if path.is_file():
                      z.write(path, pathlib.Path("DrunkMeter") / path.relative_to(addon))

          repo_readme = """# DrunkMeter

          A lightweight Vanilla WoW / OctoWoW addon for tracking estimated drunkenness.

          ## Features

          - Tracks alcohol potency and drunkenness from confirmed drink consumption.
          - Syncs Blizzard's sober/tipsy/drunk/smashed messages without pinning high smashed values to 98.
          - Automatically estimates decay while offline and resumes partial decay ticks on login.
          - Corrects drunk-distorted hostile enemy levels on the target frame and visible nameplates.
          - Shows a compact textured vertical meter with threshold warnings.
          - Keeps failed/cooldown drink attempts from increasing the meter.
          - Keeps only the latest 20 offline snapshots and 200 debug-log entries.

          ## Install

          Download `DrunkMeter-0.5.0.zip`, extract it, and copy the `DrunkMeter` folder into:

          `Interface\\AddOns\\DrunkMeter`

          Then enable **DrunkMeter** from the AddOns menu.

          ## Offline tracking

          DrunkMeter saves the current value, partial decay-tick progress and a timestamp in SavedVariables. On the next login it applies the same live decay rate to elapsed offline time. Server hour/minute are stored alongside snapshots for diagnostics; elapsed seconds use Lua `time()` because WoW 1.12 `GetGameTime()` has no date component.

          ## Compatibility

          Built for the WoW 1.12.1 API (`Interface: 11200`) and OctoWoW.

          Current version: **0.5.0**
          """
          (root / "README.md").write_text(textwrap.dedent(repo_readme), encoding="utf-8")

          if old_zip.exists():
              old_zip.unlink()
          shutil.rmtree(build)

      - name: Commit build
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md src DrunkMeter-0.5.0.zip DrunkMeter-0.4.0.zip
          git commit -m 'Add offline decay tracking and fix smashed-state pinning in 0.5.0'
          git push
