A lightweight Vanilla WoW / OctoWoW addon for tracking estimated drunkenness.

## Features

- Confirmed-drink tracking; failed/cooldown uses do not increase the meter.
- 0-256 scale with Blizzard sober/tipsy/drunk/smashed synchronisation.
- One authoritative 10-second live decay clock with offline partial-phase recovery.
- Target/nameplate true-level correction with nameplate failures isolated from core tracking.
- Tall **32 px outer / 28 px inner** meter with flat dark-red fill.
- Exactly two static markers: **DRUNK** grey and **SMASHED** gold.
- White 2 px full-height decay ticker, independent of fill height.

## 0.6.2

- Restored the pre-regression width and inset fill so it cannot cover the border.
- Uses the Vanilla-safe `Interface\\\\ChatFrame\\\\ChatFrameBackground` solid texture for fill/lines.
- Removed chat/system phase resets that could repeatedly restart the decay clock.
- Callback elapsed is sanity-checked and falls back to monotonic `GetTime()` when absent/invalid.
- Offline recovery is one-shot and preserves the remainder of the 10-second phase.
- `/drunk debug` records periodic raw/fallback delta, used delta, phase/value, ticks, explicit resets and drinks.

## Install

Download `DrunkMeter-0.6.2.zip`, extract it, and copy `DrunkMeter` to `Interface\\\\AddOns\\\\DrunkMeter`.

Built for WoW 1.12.1 (`Interface: 11200`) / OctoWoW.

Current version: **0.6.2**
''')
